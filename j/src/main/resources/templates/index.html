<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/static/lib/purify.min.js"></script>
    <script src="/static/lib/marked.min.js"></script>
    <link rel="stylesheet" href="/static/lib/font-awesome.all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <title>{{page_title}}</title>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-headset"></i> {{page_title}}</h1>
            <div class="system-settings-link-container">
                <button id="newChat" class="btn-clear" title="新对话">
                    <i class="fas fa-plus-circle"></i> 新对话
                </button>
                <a href="/admin/config?t={{token}}" id="link-admin" class="system-settings-link" target="_blank" style="display:none;">
                    <i class="fas fa-cog"></i> 系统管理
                </a>
                <a href="/user/api?t={{token}}" id="link-api" class="system-settings-link" target="_blank" style="display:none;">
                    <i class="fas fa-key"></i> API管理
                </a>
                <a href="#" id="link-agent" class="system-settings-link" onclick="showChangePwd(); return false;">
                    <i class="fas fa-lock"></i> 修改密码
                </a>
                <a href="#" class="system-settings-link" title="注销" onclick="logout(); return false;">
                    <i class="fas fa-sign-out-alt"></i> 注销
                </a>
            </div>
        </header>

        <div class="welcome-banner welcome-admin" id="welcome-admin" style="display:none;">
            <i class="fas fa-user-shield"></i> 欢迎 {{uid}} 使用本系统
        </div>
        <div class="welcome-banner welcome-agent" id="welcome-agent" style="display:none;">
            <i class="fas fa-headset"></i> 欢迎 {{uid}} 使用本系统，请随时关注用户的呼叫，无法值班请退出本系统
        </div>
        <div class="welcome-banner welcome-api" id="welcome-api" style="display:none;">
            <i class="fas fa-plug"></i> 欢迎 {{uid}} 与本系统实现互联互通
        </div>

        <div class="chat-container" id="chat-container">
        </div>

        <form id="query-form">
            <div class="input-container">
                <input type="text" class="input-field" id="query-input" name="msg"
                       placeholder="请输入您的问题..." required autocomplete="off">
                <div class="button-container">
                    <button type="submit" class="send-button" id="send-button">
                        <i class="fas fa-paper-plane"></i> 发送
                    </button>
                    <button type="button" class="stop-button" id="stop-button">
                        <i class="fas fa-stop"></i> 停止
                    </button>
                </div>
            </div>
            <input type="hidden" id="uid" name="uid" value="{{uid}}">
            <input type="hidden" id="app_source" name="app_source" value="{{app_source}}">
        </form>
    </div>

    <!-- 修改密码弹窗 -->
    <div id="pwdModal" class="pwd-modal-overlay" style="display:none;">
        <div class="pwd-modal">
            <h3><i class="fas fa-lock"></i> 修改密码</h3>
            <div class="pwd-modal-error" id="pwdError" style="display:none;"></div>
            <form id="pwdForm">
                <div class="pwd-field">
                    <label>旧密码</label>
                    <input type="password" id="oldPwd" required>
                </div>
                <div class="pwd-field">
                    <label>新密码</label>
                    <input type="password" id="newPwd" required>
                </div>
                <div class="pwd-actions">
                    <button type="button" class="cfg-btn cfg-btn-reset" onclick="hideChangePwd()">取消</button>
                    <button type="submit" class="cfg-btn cfg-btn-save">确认修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 从 URL 参数 t 提取 token 并持久化 -->
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var t = params.get('t');
            if (t) {
                localStorage.setItem('token', t);
            }
            // 根据角色显示对应的头部链接和欢迎横幅
            var userRole = parseInt('{{role}}') || 0;
            if (userRole === 1) {
                var el = document.getElementById('link-admin');
                if (el) el.style.display = '';
                var banner = document.getElementById('welcome-admin');
                if (banner) banner.style.display = '';
            } else if (userRole === 2) {
                var banner = document.getElementById('welcome-agent');
                if (banner) banner.style.display = '';
            } else if (userRole === 3) {
                var el = document.getElementById('link-api');
                if (el) el.style.display = '';
                var banner = document.getElementById('welcome-api');
                if (banner) banner.style.display = '';
            }
        })();
    </script>
    <script src="/static/js/app.js"></script>
</body>
</html>
